name: API Tests CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  run-api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 2: Настройка окружения Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Укажите вашу версию Python

      # Шаг 3: Установка зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4: Установка Allure CLI
      # Используем официальный action для установки
      - name: Install Allure
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-version: 2.24.1 # Можно указать конкретную версию

      # Шаг 5: Запуск тестов с Allure
      # pytest будет запущен, а результаты сохранены в папку 'allure-results'
      - name: Run tests
        run: pytest --alluredir=allure-results
        # Продолжить выполнение, даже если тесты упали, чтобы отчет все равно сгенерировался
        continue-on-error: true

      # Шаг 6: Генерация Allure отчета
      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      # Шаг 7: Развертывание отчета на GitHub Pages
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Токен для доступа к репозиторию, создается автоматически
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Директория, которую нужно опубликовать (наш отчет)
          publish_dir: ./allure-report```

